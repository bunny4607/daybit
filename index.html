<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybit</title>
<style>
  :root { --bg:#F7F7F5; --text:#1A1A1A; --muted:#6F6F6B; --accent:#5B5BD6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0E0E10; --text:#EDEDEF; --muted:#9A9AA1; --accent:#8B8BF0; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font:17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align:center; padding:0 20px; }
  h1 { font-size:44px; letter-spacing:-1px; margin:16px 0 4px; }
  p { color:var(--muted); margin:0 0 24px; }
  a { color:var(--accent); font-weight:600; text-decoration:none; }
  .badge { width:72px; height:72px; border-radius:20px; margin:0 auto; background:linear-gradient(145deg,#6A6AE6,#4B4BC4);
           display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<main>
  <div class="badge">
    <svg width="46" height="46" viewBox="21 21 66 66" aria-hidden="true">
      <path d="M54,32 a22,22 0 1,1 0,44 a22,22 0 1,1 0,-44" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M44,55 L51,62 L65,47" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Daybit</h1>
  <p>Daily, weekly and monthly tasks. Simple, private, beautiful.</p>
  <a href="privacy-policy.html">Privacy policy</a>
</main>
</body>
</html>
